    ["Macroled Neutro 24W","Unidad"],["Macroled 6W Redondas","Unidad"],

  const DEFAULT_BEVERAGES = [
    ["Agua botella Villavicencio","500ml"],["Jugo Levite botella","500ml"],
    ["Agua con gas","500ml"],["Coca Cola Original","500ml"],["Coca Cola Zero","500ml"],
    ["Coca Cola Light","500ml"],["Sprite","500ml"],["Fanta","500ml"],
    ["Heineken","473cc"],["Sprite Zero","500ml"],["Stella","473cc"]
  ];

  const DEFAULT_EMPLOYEES = [
    ["Emilio","2001"],["José","2002"],["Daniel","1234"],["Pablo","2004"],
    ["Lorena","2005"],["Junior","2006"],["Graciela","2007"],["Ivana","2008"],
    ["Yamila","2009"],["Betiana","2010"],["Cynthia","2011"],["Jony","2012"],
    ["Gonzalo","2013"],["Jonn","2014"]
  ];

  // Categorías de productos a las que puede acceder cada rol de empleado.
  // Un empleado sin rol asignado ("Todas las categorías") ve todas las
  // categorías existentes, para no dejar a nadie sin acceso por accidente.
  const ROLE_CATEGORIES = {
    "Mucama": ["Productos de limpieza","Bebidas"],
    "Mantenimiento": ["Productos de limpieza","Bebidas","Mantenimiento"],
    "Recepción": ["Productos de limpieza","Bebidas"]
  };
  const ROLES = Object.keys(ROLE_CATEGORIES);

  let db = null;
  let employees = [];
  let products = [];
  let categories = [];
  let config = { adminPin: "1982", stock: {} };
  let movements = [];
  let currentUser = null;
  let view = "login";
  let selectedCategory = null;
  let adminTab = "movimientos";

  const app = document.getElementById("app");

  function esc(s){
    return String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
  }
  function fmtDate(ts){
    const d = new Date(ts);
    return d.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit"}) + " " +
           d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
  }

  // Devuelve las categorías visibles para un empleado según su rol.
  // Si no tiene rol asignado (o el rol no está en ROLE_CATEGORIES),
  // ve todas las categorías existentes.
  function getAllowedCategories(role){
    if(!role || !ROLE_CATEGORIES[role]) return categories;
    return categories.filter(c => ROLE_CATEGORIES[role].includes(c));
  }

  // Muestra una notificación flotante (toast) en la parte inferior de la pantalla
  function showToast(message, type){
    let toast = document.getElementById("appToast");
    if(!toast){
      toast = document.createElement("div");
      toast.id = "appToast";
      document.body.appendChild(toast);
    }
    toast.className = "toast" + (type ? " toast-"+type : "");
    toast.textContent = message;
    requestAnimationFrame(() => toast.classList.add("show"));
    clearTimeout(toast._hideTimer);
    toast._hideTimer = setTimeout(() => toast.classList.remove("show"), 2600);
  }

  // Genera y descarga un archivo Excel (.xlsx) con una o varias hojas.
  // sheetsDef: array de { name, rows } donde rows es un array de arrays (filas).
  function exportWorkbook(sheetsDef, filename){
    if(typeof XLSX === "undefined"){
      alert("No se pudo cargar la librería de Excel. Revisá tu conexión a internet e intentá de nuevo.");
      return;
    }
    const wb = XLSX.utils.book_new();
    sheetsDef.forEach(sd => {
      const ws = XLSX.utils.aoa_to_sheet(sd.rows);
      XLSX.utils.book_append_sheet(wb, ws, sd.name.substring(0,31));
    });
    XLSX.writeFile(wb, filename);
  }

  // Convierte una hoja de Excel en un array de objetos usando la primera fila como encabezados.
  function sheetToObjects(ws){
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:""});
    if(!rows.length) return [];
    const headers = rows[0].map(h=>String(h).trim());
    return rows.slice(1)
      .filter(r=>r.some(c=>String(c).trim()!==""))
      .map(r=>{
        const obj = {};
        headers.forEach((h,i)=>{ obj[h] = r[i]!==undefined ? r[i] : ""; });
        return obj;
      });
  }

  // Importa un archivo Excel (con el mismo formato que "Exportar todo") a Firestore.
  // Solo AGREGA lo que sea nuevo: no borra ni duplica lo que ya está cargado.
  async function importWorkbookFile(file){
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:"array"});
    let addedCats = 0, addedProds = 0, addedEmps = 0, addedMovs = 0;

    // --- Productos y categorías ---
    if(wb.Sheets["Productos"]){
      const rows = sheetToObjects(wb.Sheets["Productos"]);
      const newCats = [];
      rows.forEach(r=>{
        const cat = String(r["Categoría"]||"").trim();
        if(cat && !categories.includes(cat) && !newCats.includes(cat)) newCats.push(cat);
      });
      if(newCats.length){
        categories.push(...newCats);
        await saveConfig();
        addedCats = newCats.length;
      }
      const existingKey = new Set(products.map(p=>p.name+"|"+p.category));
      const toAdd = [];
      rows.forEach(r=>{
        const name = String(r["Producto"]||"").trim();
        const medida = String(r["Medida"]||"").trim() || "Unidad";
        const category = String(r["Categoría"]||"").trim();
        if(!name || !category) return;
        const key = name+"|"+category;
        if(existingKey.has(key)) return;
        existingKey.add(key);
        toAdd.push({name, medida, category});
      });
      for(let i=0;i<toAdd.length;i+=400){
        const chunk = toAdd.slice(i, i+400);
        const batch = db.batch();
        const refs = chunk.map(p=>{ const ref = db.collection("products").doc(); batch.set(ref, p); return ref; });
        await batch.commit();
        chunk.forEach((p,idx)=> products.push({ id: refs[idx].id, ...p }));
      }
      addedProds = toAdd.length;
    }

    // --- Empleados ---
    if(wb.Sheets["Empleados"]){
      const rows = sheetToObjects(wb.Sheets["Empleados"]);
      const existingNames = new Set(employees.map(e=>e.name));
      const toAdd = [];
      rows.forEach(r=>{
        const name = String(r["Nombre"]||"").trim();
        const pin = String(r["PIN"]||"").trim();
        const role = String(r["Rol"]||"").trim();
        if(!name || existingNames.has(name)) return;
        existingNames.add(name);
        toAdd.push({name, pin, role});
      });
      for(let i=0;i<toAdd.length;i+=400){
        const chunk = toAdd.slice(i, i+400);
        const batch = db.batch();
        const refs = chunk.map(e=>{ const ref = db.collection("employees").doc(); batch.set(ref, e); return ref; });
        await batch.commit();
        chunk.forEach((e,idx)=> employees.push({ id: refs[idx].id, ...e }));
      }
      addedEmps = toAdd.length;
    }

    // --- Movimientos ---
    if(wb.Sheets["Movimientos"]){
      const rows = sheetToObjects(wb.Sheets["Movimientos"]);
      const empByName = new Map(employees.map(e=>[e.name, e]));
      const toAdd = [];
      rows.forEach(r=>{
        const product = String(r["Producto"]||"").trim();
        const qty = parseInt(r["Cantidad"], 10);
        if(!product || !qty) return;
        const employeeName = String(r["Empleado"]||"").trim();
        const category = String(r["Categoría"]||"").trim();
        const area = String(r["Área"]||"").trim();
        let ts = Number(r["Timestamp"]);
        if(!ts || isNaN(ts)) ts = Date.now();
        const emp = empByName.get(employeeName);
        toAdd.push({
          employeeId: emp ? emp.id : "", employeeName: employeeName || "Desconocido",
          product, category, qty, type:"Salida", area, ts
        });
      });
      for(let i=0;i<toAdd.length;i+=400){
        const chunk = toAdd.slice(i, i+400);
        const batch = db.batch();
        const refs = chunk.map(m=>{ const ref = db.collection("movements").doc(); batch.set(ref, m); return ref; });
        await batch.commit();
        chunk.forEach((m,idx)=> movements.push({ id: refs[idx].id, ...m }));
      }
      addedMovs = toAdd.length;
    }

    return { addedCats, addedProds, addedEmps, addedMovs };
  }

  // Agrupa movimientos por producto+categoría y suma las cantidades retiradas.
  function buildProductSummary(rows){
    const map = new Map();
    rows.forEach(m=>{
      const key = m.product + "|" + (m.category||"");
      if(!map.has(key)) map.set(key, {product:m.product, category:m.category||"", total:0, count:0});
      const entry = map.get(key);
      entry.total += m.qty;
      entry.count += 1;
    });
    return Array.from(map.values());
  }

  // Guarda/lee/borra la sesión en el navegador para no tener que
  // volver a ingresar el PIN cada vez que se abre la app.
  const SESSION_KEY = "controlStockSession";
  function saveSession(data){
    try{
      localStorage.setItem(SESSION_KEY, JSON.stringify(data));
      if(localStorage.getItem(SESSION_KEY) === null){
        showToast("No se pudo guardar la sesión en este navegador.", "error");
      }

      showToast("El navegador está bloqueando el guardado de datos.", "error");

  }
  function readSession(){
    try{ return JSON.parse(localStorage.getItem(SESSION_KEY)); }catch(e){ return null; }
  }
  function clearSession(){
    try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
  }

  // =======================================================================
  // 2) CARGA Y SEED INICIAL DE DATOS EN FIRESTORE
  // =======================================================================
  async function loadAll(){
    try{
      const configRef = db.collection("meta").doc("config");

      // Se piden config, empleados, productos y movimientos todos juntos
      // (en paralelo) en lugar de uno por uno, para que la carga inicial
      // no espere una respuesta tras otra.
      const [configSnap, empSnap, prodSnap, movSnap] = await Promise.all([
        configRef.get(),
        db.collection("employees").get(),
        db.collection("products").get(),
        db.collection("movements").get()
      ]);

      if(!configSnap.exists){
        config = { adminPin: "1982", stock: {} };
        categories = DEFAULT_CATEGORIES.slice();
        await configRef.set({ adminPin: config.adminPin, stock: config.stock, categories });
      }else{
        const data = configSnap.data();
        config = { adminPin: data.adminPin || "1982", stock: data.stock || {} };
        categories = (data.categories && data.categories.length) ? data.categories : DEFAULT_CATEGORIES.slice();
      }

      if(empSnap.empty){
        const batch = db.batch();
        DEFAULT_EMPLOYEES.forEach(([name, pin]) => {
          const ref = db.collection("employees").doc();
          batch.set(ref, { name, pin, role: "" });
        });
        await batch.commit();
        const refreshed = await db.collection("employees").get();
        employees = refreshed.docs.map(d => ({ id: d.id, ...d.data() }));
      }else{
        employees = empSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      }

      products = prodSnap.docs.map(d => ({ id: d.id, ...d.data() }));

      async function seedCategory(catName, defaults){
        const hasAny = products.some(p => p.category === catName);
        if(!hasAny && defaults.length){
          const batch = db.batch();
          defaults.forEach(([name, medida]) => {
            const ref = db.collection("products").doc();
            batch.set(ref, { name, medida, category: catName });
          });
          await batch.commit();
          return true;
        }
        return false;
      }
      // Las 3 categorías por defecto se revisan/siembran en paralelo,
      // ya que son independientes entre sí.
      const seededAny = (await Promise.all([
        seedCategory("Productos de limpieza", DEFAULT_CLEANING),
        seedCategory("Mantenimiento", DEFAULT_MAINTENANCE),
        seedCategory("Bebidas", DEFAULT_BEVERAGES)
      ])).some(Boolean);

      // Solo se vuelve a pedir la lista de productos si realmente se
      // sembró algo nuevo (caso raro, típicamente solo la primera vez).
      if(seededAny){
        const refreshedProd = await db.collection("products").get();
        products = refreshedProd.docs.map(d => ({ id: d.id, ...d.data() }));
      }

      movements = movSnap.docs.map(d => ({ id: d.id, ...d.data() }));

      // Si había una sesión guardada en este navegador, se restaura
      // en vez de mostrar la pantalla de login. La de administrador
      // nunca se guarda, así que siempre va a pedir el PIN de nuevo.
      const session = readSession();
      if(session && session.type === "user"){
        const emp = employees.find(e => e.id === session.empId);
        if(emp){
          currentUser = { id: emp.id, name: emp.name, role: emp.role || "" };
          view = "form";
        }else{
          clearSession();
        }
      }

      render();
    }catch(err){
      app.innerHTML = `
        <div class="topbar"><h1>Control de Stock</h1><p class="sub">Error de conexión</p></div>
        <section><div class="card"><div class="msg error">
          No se pudo conectar con la base de datos: ${esc(err.message || err)}.
          Revisá la configuración de Firebase y las reglas de Firestore.
        </div></div></section>
      `;
    }
  }

  async function saveConfig(){

  async function addEmployee(name, pin, role){
    const ref = await db.collection("employees").add({ name, pin, role: role || "" });
    employees.push({ id: ref.id, name, pin, role: role || "" });
  }
  async function updateEmployee(id, data){
    await db.collection("employees").doc(id).update(data);
  }
  async function deleteEmployee(id){
    await db.collection("employees").doc(id).delete();
    employees = employees.filter(e => e.id !== id);
  }
  async function addProduct(name, medida, category){
    const ref = await db.collection("products").add({ name, medida, category });
    products.push({ id: ref.id, name, medida, category });
  }
  async function updateProduct(id, data){
    await db.collection("products").doc(id).update(data);
  }
  async function deleteProduct(id){
    await db.collection("products").doc(id).delete();
    products = products.filter(p => p.id !== id);
  }
  async function addMovement(mov){
    const ref = await db.collection("movements").add(mov);
    movements.push({ id: ref.id, ...mov });
  }
  async function deleteMovement(id){
    await db.collection("movements").doc(id).delete();
    movements = movements.filter(m => m.id !== id);
  }
  async function deleteAllMovements(){
    const all = movements.slice();
    for(let i=0;i<all.length;i+=400){
      const chunk = all.slice(i, i+400);
      const batch = db.batch();
      chunk.forEach(m => batch.delete(db.collection("movements").doc(m.id)));
      await batch.commit();
    }
    movements = [];
  }

      try{
        await deleteAllMovements();
        showToast("Se borraron todos los movimientos", "ok");
        render();
      }catch(err){
        alert("No se pudo borrar: " + (err.message || err));
      }
    };
  }

  function renderAdminResumen(content){
    const empOptions = ["Todos", ...new Set(movements.map(m=>m.employeeName))];
    const catOptions = ["Todas", ...categories];
    content.innerHTML = `
      <div class="card">
        <h2>Resumen de productos retirados</h2>
        <p style="color:var(--ink-soft);font-size:12px;margin-top:-8px;">
          Total retirado por producto, sumando los retiros de todos los empleados. Usá los filtros para acotar por fecha, categoría o empleado.
        </p>
        <div class="filters">
          <select id="rEmp">${empOptions.map(e=>`<option>${esc(e)}</option>`).join("")}</select>
          <select id="rCat">${catOptions.map(c=>`<option>${esc(c)}</option>`).join("")}</select>
        </div>
        <div class="filters" style="align-items:flex-end;">
          <div style="flex:1;min-width:130px;">
            <label style="margin-bottom:4px;">Desde</label>
            <input type="date" id="rDesde" style="margin-bottom:0;">
          </div>
          <div style="flex:1;min-width:130px;">
            <label style="margin-bottom:4px;">Hasta</label>
            <input type="date" id="rHasta" style="margin-bottom:0;">
          </div>
          <button class="small-btn" id="rClearDatesBtn">Limpiar fechas</button>
        </div>
        <div style="max-height:460px;overflow:auto;">
          <table>
            <thead><tr><th>Producto</th><th>Retiros</th><th>Total retirado</th></tr></thead>
            <tbody id="resumenTbody"></tbody>
          </table>
        </div>
        <div style="margin-top:12px;"><button class="btn btn-secondary" id="resumenExportBtn">Descargar Excel</button></div>
      </div>
    `;

    function getFiltered(){
      const fe = document.getElementById("rEmp").value;
      const fc = document.getElementById("rCat").value;
      const fd = document.getElementById("rDesde").value;
      const fh = document.getElementById("rHasta").value;
      const desdeTs = fd ? new Date(fd+"T00:00:00").getTime() : null;
      const hastaTs = fh ? new Date(fh+"T23:59:59.999").getTime() : null;
      return movements.filter(m => (fe==="Todos"||m.employeeName===fe) && (fc==="Todas"||m.category===fc)
        && (desdeTs===null || m.ts >= desdeTs) && (hastaTs===null || m.ts <= hastaTs));
    }

    function drawSummary(){
      const summary = buildProductSummary(getFiltered());
      if(!summary.length){
        document.getElementById("resumenTbody").innerHTML = `<tr><td colspan="3"><div class="empty">Sin retiros para este filtro.</div></td></tr>`;
        return;
      }
      const byCat = {};
      summary.forEach(s=>{
        const cat = s.category || "Sin categoría";
        if(!byCat[cat]) byCat[cat] = [];
        byCat[cat].push(s);
      });
      let rowsHtml = "";
      Object.keys(byCat).sort().forEach(cat=>{
        rowsHtml += `<tr class="cat-heading"><td colspan="3">${esc(cat)}</td></tr>`;
        byCat[cat].sort((a,b)=>b.total-a.total).forEach(s=>{
          rowsHtml += `<tr><td>${esc(s.product)}</td><td>${s.count}</td><td><strong>${s.total}</strong></td></tr>`;
        });
      });
      document.getElementById("resumenTbody").innerHTML = rowsHtml;
    }

    ["rEmp","rCat","rDesde","rHasta"].forEach(id=>{
      document.getElementById(id).onchange = drawSummary;
    });
    document.getElementById("rClearDatesBtn").onclick = () => {
      document.getElementById("rDesde").value = "";
      document.getElementById("rHasta").value = "";
      drawSummary();
    };
    drawSummary();

    document.getElementById("resumenExportBtn").onclick = () => {
      const summary = buildProductSummary(getFiltered())
        .sort((a,b)=> (a.category||"").localeCompare(b.category||"") || a.product.localeCompare(b.product));
      const aoa = [["Categoría","Producto","Cantidad de retiros","Total retirado"]];
      summary.forEach(s => aoa.push([s.category||"", s.product, s.count, s.total]));
      exportWorkbook([{name:"Resumen por producto", rows: aoa}], "resumen_retiros.xlsx");
    };
  }

  function renderAdminEstadisticas(content){
    content.innerHTML = `
      <div class="card">
        <h2>Estadísticas</h2>
        <p style="color:var(--ink-soft);font-size:12px;margin-top:-8px;">
          Resumen general de la actividad registrada. Usá los filtros para acotar por fecha.
        </p>
        <div class="filters" style="align-items:flex-end;margin-bottom:0;">
          <div style="flex:1;min-width:130px;">
            <label style="margin-bottom:4px;">Desde</label>
            <input type="date" id="eDesde" style="margin-bottom:0;">
          </div>
          <div style="flex:1;min-width:130px;">
            <label style="margin-bottom:4px;">Hasta</label>
            <input type="date" id="eHasta" style="margin-bottom:0;">
          </div>
          <button class="small-btn" id="eClearDatesBtn">Limpiar fechas</button>
        </div>
      </div>
      <div class="stat-grid" id="eStatGrid"></div>
      <div class="card">
        <h2>Productos más retirados</h2>
        <div id="eTopProducts"></div>
      </div>
      <div class="card">
        <h2>Retiros por empleado</h2>
        <div id="eTopEmployees"></div>
      </div>
      <div class="card">
        <h2>Retiros por categoría</h2>
        <div id="eTopCategories"></div>
      </div>
    `;

    function getFiltered(){
      const fd = document.getElementById("eDesde").value;
      const fh = document.getElementById("eHasta").value;
      const desdeTs = fd ? new Date(fd+"T00:00:00").getTime() : null;
      const hastaTs = fh ? new Date(fh+"T23:59:59.999").getTime() : null;
      return movements.filter(m => (desdeTs===null || m.ts >= desdeTs) && (hastaTs===null || m.ts <= hastaTs));
    }

    function groupSum(rows, keyFn){
      const map = new Map();
      rows.forEach(m=>{
        const key = keyFn(m);
        if(!key) return;
        if(!map.has(key)) map.set(key, {key, total:0, count:0});
        const entry = map.get(key);
        entry.total += m.qty;
        entry.count += 1;
      });
      return Array.from(map.values());
    }

    function drawBars(containerId, entries){
      const container = document.getElementById(containerId);
      if(!entries.length){ container.innerHTML = `<div class="empty">Sin datos para este filtro.</div>`; return; }
      const max = Math.max(...entries.map(e=>e.total));
      container.innerHTML = entries.map(e => `
        <div class="bar-row">
          <div class="bar-label"><span>${esc(e.key)}</span><span><strong>${e.total}</strong> (${e.count} retiro${e.count===1?"":"s"})</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${max ? (e.total/max*100) : 0}%;"></div></div>
        </div>
      `).join("");
    }

    function draw(){
      const rows = getFiltered();
      const totalMov = rows.length;
      const totalUnidades = rows.reduce((s,m)=>s+m.qty,0);
      const empleadosActivos = new Set(rows.map(m=>m.employeeName)).size;
      const productosDistintos = new Set(rows.map(m=>m.product)).size;

      document.getElementById("eStatGrid").innerHTML = `
        <div class="stat-card"><div class="num">${totalMov}</div><div class="lbl">Movimientos registrados</div></div>
        <div class="stat-card"><div class="num">${totalUnidades}</div><div class="lbl">Unidades retiradas</div></div>
        <div class="stat-card"><div class="num">${empleadosActivos}</div><div class="lbl">Empleados con retiros</div></div>
        <div class="stat-card"><div class="num">${productosDistintos}</div><div class="lbl">Productos distintos</div></div>
      `;

      const byProduct = groupSum(rows, m=>m.product).sort((a,b)=>b.total-a.total).slice(0,8);
      drawBars("eTopProducts", byProduct);

      const byEmployee = groupSum(rows, m=>m.employeeName).sort((a,b)=>b.total-a.total);
      drawBars("eTopEmployees", byEmployee);

      const byCategory = groupSum(rows, m=>m.category||"Sin categoría").sort((a,b)=>b.total-a.total);
      drawBars("eTopCategories", byCategory);
    }

    document.getElementById("eDesde").onchange = draw;
    document.getElementById("eHasta").onchange = draw;
    document.getElementById("eClearDatesBtn").onclick = () => {
      document.getElementById("eDesde").value = "";
      document.getElementById("eHasta").value = "";
      draw();
    };
    draw();
  }

  function renderAdminProductos(content){
    content.innerHTML = `
      <div class="card">
        <h2>Categorías</h2>
        <div id="catList"></div>
        <div class="add-cat-row">
          <input type="text" id="newCatInput" placeholder="Nueva categoría">
          <button class="small-btn" id="addCatBtn">Agregar</button>
        </div>
      </div>
      <div class="card">
        <h2>Productos</h2>
        <div id="prodList"></div>
        <div class="prod-row" style="margin-top:10px;">
          <input type="text" id="newProdName" placeholder="Nombre del producto">
          <input type="text" id="newProdMedida" placeholder="Medida (ej: 5L)">
          <select id="newProdCat">${categories.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("")}</select>
          <button class="small-btn" id="addProdBtn">Agregar</button>
        </div>
      </div>
    `;
    function drawCats(){
      document.getElementById("catList").innerHTML = categories.map((c,i)=>`
        <div class="emp-row">
          <input type="text" value="${esc(c)}" data-idx="${i}" class="catName">
          <button class="small-btn" data-idx="${i}" data-action="delCat">Quitar</button>
        </div>
      `).join("");
      Array.from(document.querySelectorAll(".catName")).forEach(inp=>{
        inp.onchange = async () => {
          const oldName = categories[inp.dataset.idx];
          const newName = inp.value.trim();
          if(!newName) return;
          const affected = products.filter(p=>p.category===oldName);
          for(const p of affected){ await updateProduct(p.id, {category:newName}); p.category = newName; }
          categories[inp.dataset.idx] = newName;
          await saveConfig();
          render();
        };
      });
      Array.from(document.querySelectorAll("[data-action='delCat']")).forEach(btn=>{
        btn.onclick = async () => {
          const catName = categories[btn.dataset.idx];
          if(products.some(p=>p.category===catName)){
            alert("Esta categoría tiene productos cargados. Movelos o eliminalos primero.");
            return;
          }
          categories.splice(btn.dataset.idx,1);
          await saveConfig();
          render();
        };
      });
    }
    drawCats();

    document.getElementById("addCatBtn").onclick = async () => {
      const val = document.getElementById("newCatInput").value.trim();
      if(!val) return;
      if(categories.includes(val)){ alert("Ya existe esa categoría."); return; }
      categories.push(val);
      await saveConfig();
      render();
    };

    function drawProds(){
      document.getElementById("prodList").innerHTML = products.map((p,i)=>`
        <div class="prod-row">
          <input type="text" value="${esc(p.name)}" data-idx="${i}" class="prodName">
          <input type="text" value="${esc(p.medida)}" data-idx="${i}" class="prodMedida" style="max-width:70px;">
          <select data-idx="${i}" class="prodCat">
            ${categories.map(c=>`<option value="${esc(c)}" ${c===p.category?"selected":""}>${esc(c)}</option>`).join("")}
          </select>
          <button class="small-btn" data-idx="${i}" data-action="delProd">Quitar</button>
        </div>
      `).join("") || `<div class="empty">No hay productos todavía.</div>`;

      Array.from(document.querySelectorAll(".prodName")).forEach(inp=>{
        inp.onchange = async () => { const p=products[inp.dataset.idx]; p.name=inp.value.trim(); await updateProduct(p.id,{name:p.name}); };
      });
      Array.from(document.querySelectorAll(".prodMedida")).forEach(inp=>{
        inp.onchange = async () => { const p=products[inp.dataset.idx]; p.medida=inp.value.trim(); await updateProduct(p.id,{medida:p.medida}); };
      });
      Array.from(document.querySelectorAll(".prodCat")).forEach(sel=>{
        sel.onchange = async () => { const p=products[sel.dataset.idx]; p.category=sel.value; await updateProduct(p.id,{category:p.category}); };
      });
      Array.from(document.querySelectorAll("[data-action='delProd']")).forEach(btn=>{
        btn.onclick = async () => { await deleteProduct(products[btn.dataset.idx].id); drawProds(); };
      });
    }
    drawProds();

    document.getElementById("addProdBtn").onclick = async () => {
      const name = document.getElementById("newProdName").value.trim();
      const medida = document.getElementById("newProdMedida").value.trim() || "Unidad";
      const cat = document.getElementById("newProdCat").value;
      if(!name) return;
      await addProduct(name, medida, cat);
      document.getElementById("newProdName").value = "";
      document.getElementById("newProdMedida").value = "";
      drawProds();
    };
  }

  function renderAdminEmpleados(content){
    content.innerHTML = `
      <div class="card">
        <h2>Empleados y PIN</h2>
        <p style="color:var(--ink-soft);font-size:12px;margin-top:-8px;">
          Cada empleado necesita su nombre y un PIN propio para poder registrar movimientos.
          El rol determina qué categorías de productos puede ver: Mucama y Recepción acceden a
          Productos de limpieza y Bebidas; Mantenimiento accede además a Mantenimiento. "Todas las
          categorías" deja al empleado sin restricción.
        </p>
        <div id="empList"></div>
        <button class="btn btn-secondary" id="addEmpBtn" style="margin-top:8px;">+ Agregar empleado</button>
      </div>
      <div class="card">
        <h2>PIN de administrador</h2>
        <input type="tel" inputmode="numeric" maxlength="4" id="newAdminPin" placeholder="Nuevo PIN admin">
        <button class="btn btn-secondary" id="saveAdminPin">Guardar PIN admin</button>
      </div>
    `;
    function drawEmpList(){
      document.getElementById("empList").innerHTML = employees.map((e,i)=>`
        <div class="emp-row">
          <input type="text" value="${esc(e.name)}" data-idx="${i}" class="empName">
          <input type="tel" inputmode="numeric" maxlength="4" value="${esc(e.pin)}" data-idx="${i}" class="empPin">
          <select data-idx="${i}" class="empRole">
            <option value="" ${!e.role?"selected":""}>Todas las categorías</option>
            ${ROLES.map(r=>`<option value="${esc(r)}" ${e.role===r?"selected":""}>${esc(r)}</option>`).join("")}
          </select>
          <button class="small-btn" data-idx="${i}" data-action="del">Quitar</button>
        </div>
      `).join("");
      Array.from(document.querySelectorAll(".empName")).forEach(inp=>{
        inp.onchange = async () => { const e=employees[inp.dataset.idx]; e.name=inp.value.trim()||e.name; await updateEmployee(e.id,{name:e.name}); };
      });
      Array.from(document.querySelectorAll(".empPin")).forEach(inp=>{
        restrictPinInput(inp);
        inp.addEventListener("change", async () => {
          const e=employees[inp.dataset.idx];
          const newPin = inp.value.trim();
          if(newPin === e.pin) return;
          if(newPin.length !== 4){
            alert("El PIN debe tener exactamente 4 dígitos.");
            inp.value = e.pin;
            return;
          }
          if(!confirm(`¿Estás seguro que el nuevo PIN de ${e.name} es: ${newPin}?`)){
            inp.value = e.pin;
            return;
          }
          e.pin=newPin;
          await updateEmployee(e.id,{pin:e.pin});
          showToast(`PIN de ${e.name} actualizado a ${newPin}`, "ok");
        });
      });
      Array.from(document.querySelectorAll(".empRole")).forEach(sel=>{
        sel.onchange = async () => { const e=employees[sel.dataset.idx]; e.role=sel.value; await updateEmployee(e.id,{role:e.role}); };
      });
      Array.from(document.querySelectorAll("[data-action='del']")).forEach(btn=>{
        btn.onclick = async () => { await deleteEmployee(employees[btn.dataset.idx].id); drawEmpList(); };
      });
    }
    drawEmpList();

    document.getElementById("addEmpBtn").onclick = async () => {
      const n = employees.length + 1;
      await addEmployee("Nuevo empleado "+n, String(2100+n), "");
      drawEmpList();
    };

    restrictPinInput(document.getElementById("newAdminPin"));
    document.getElementById("saveAdminPin").onclick = async () => {
      const val = document.getElementById("newAdminPin").value.trim();
      if(val.length !== 4){ alert("El PIN debe tener exactamente 4 dígitos."); return; }
      config.adminPin = val;
      await saveConfig();
      alert("PIN de administrador actualizado.");
    };
  }

  function render(){
    if(view==="login") renderLogin();
    else if(view==="form") renderForm();
    else if(view==="admin-login") renderAdminLogin();
    else if(view==="admin") renderAdmin();
  }

  // =======================================================================
  // INICIO
  // =======================================================================
  if(NOT_CONFIGURED){
    renderSetupNeeded();
  }else{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    loadAll();
  }
})();
</script>
