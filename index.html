<!--
  =========================================================================
  CONFIGURACIÓN DE FIREBASE - COMPLETAR ANTES DE USAR
  =========================================================================
  1. Andá a https://console.firebase.google.com
  2. Creá un proyecto (o abrí uno existente)
  3. Activá "Firestore Database" (modo producción o prueba)
  4. Registrá una app web (ícono </>) y copiá el objeto de configuración
  5. Pegalo acá abajo, reemplazando los valores "TU_..."
  6. En Authentication > Sign-in method, activá el proveedor "Anonymous".
     (Sin esto, la app no va a poder iniciar sesión y las reglas de abajo
     van a bloquear todo el acceso a la base.)
  7. En Firestore > Reglas, pegá:

     rules_version = '2';
     service cloud.firestore {
       match /databases/{database}/documents {
         match /{document=**} {
           allow read, write: if request.auth != null;
         }
       }
     }

     (Esto exige que el que lee o escribe haya iniciado sesión, aunque sea
     de forma anónima. Bloquea a cualquiera que encuentre el proyecto y
     pegue tu configuración en Postman o en la consola del navegador sin
     pasar por la app. No reemplaza el PIN interno de la app, que sigue
     siendo la única barrera entre empleados y el panel de admin.)
  =========================================================================
-->

     ejecutan están movidos al principio del <body> (ver más abajo). Así
     el mensaje "Cargando..." aparece de inmediato en vez de que la
     pantalla quede en blanco esperando que bajen los SDK. -->

</style>

  function fmtDate(ts){

  // Formatea un intervalo de tiempo como "1 día, 23 horas y 46 minutos",
  // omitiendo las unidades en cero. Se usa para promedio/mediana entre
  // aperturas y para el detalle de cada intervalo.
  function fmtDuration(ms){
    if(ms === null || ms === undefined || isNaN(ms)) return "Datos insuficientes";
    let totalMinutes = Math.round(Math.max(0, ms) / 60000);
    const days = Math.floor(totalMinutes / 1440);
    totalMinutes -= days * 1440;
    const hours = Math.floor(totalMinutes / 60);
    const minutes = totalMinutes - hours * 60;
    const parts = [];
    if(days) parts.push(`${days} día${days===1?"":"s"}`);
    if(hours) parts.push(`${hours} hora${hours===1?"":"s"}`);
    if(minutes || parts.length===0) parts.push(`${minutes} minuto${minutes===1?"":"s"}`);
    if(parts.length === 1) return parts[0];
    return parts.slice(0,-1).join(", ") + " y " + parts[parts.length-1];
  }
  // Versión redondeada, en lenguaje natural, para la línea de "Interpretación".
  function fmtRoughFrequency(ms){
    if(ms === null || ms === undefined || isNaN(ms)) return "";
    const days = ms / 86400000;
    if(days >= 1){
      const r = Math.round(days);
      return `cada ${r} día${r===1?"":"s"}`;
    }
    const hours = Math.max(1, Math.round(ms / 3600000));
    return `cada ${hours} hora${hours===1?"":"s"}`;
  }
  // Versión decimal para la tabla comparativa ("Cada 1,9 días").
  function fmtFrequencyDecimal(ms){
    if(ms === null || ms === undefined || isNaN(ms)) return "Datos insuficientes";
    const days = ms / 86400000;
    if(days >= 1) return `Cada ${days.toFixed(1).replace(".",",")} días`;
    const hours = ms / 3600000;
    return `Cada ${hours.toFixed(1).replace(".",",")} horas`;
  }
  // Formatea una fecha como YYYY-MM-DD en hora LOCAL (a diferencia de

  function toDateInputValue(d){

    return `${y}-${m}-${day}`;

  // Dado un array de aperturas (de UN producto), calcula cantidad, primera
  // y última apertura, y a partir de los intervalos entre aperturas
  // consecutivas: promedio, mediana y aperturas por día/semana/mes.
  // Si hay menos de 2 aperturas no hay ningún intervalo que promediar:
  // se devuelve avgMs/medianMs/perDay/perWeek/perMonth en null en vez de
  // inventar un número, para que la interfaz muestre "Datos insuficientes".
  function computeAperturaStats(rows){
    const sorted = rows.slice().sort((a,b)=>a.ts-b.ts);
    const count = sorted.length;
    if(count === 0) return { count:0, first:null, last:null, avgMs:null, medianMs:null, perDay:null, perWeek:null, perMonth:null };
    const first = sorted[0].ts, last = sorted[sorted.length-1].ts;
    const intervals = [];
    for(let i=1;i<sorted.length;i++) intervals.push(sorted[i].ts - sorted[i-1].ts);
    let avgMs = null, medianMs = null, perDay = null, perWeek = null, perMonth = null;
    if(intervals.length){
      avgMs = intervals.reduce((s,v)=>s+v,0) / intervals.length;
      const sortedInt = intervals.slice().sort((a,b)=>a-b);
      const mid = Math.floor(sortedInt.length/2);
      medianMs = sortedInt.length % 2 ? sortedInt[mid] : (sortedInt[mid-1]+sortedInt[mid]) / 2;
      if(avgMs > 0){
        perDay = 86400000 / avgMs;
        perWeek = perDay * 7;
        perMonth = perDay * 30;
      }
    }
    return { count, first, last, avgMs, medianMs, perDay, perWeek, perMonth };
  }
  // Resuelve un preset de período ("hoy", "7d", "30d", "mes", "mesant",
  // "custom") a un rango {desde, hasta} en timestamps (ms), en hora local.
  function resolveDesayPeriod(periodKey, customDesde, customHasta){
    const now = new Date();
    const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    const endOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate(),23,59,59,999).getTime();
    if(periodKey === "hoy"){
      return { desde: startOfDay(now), hasta: endOfDay(now) };
    }
    if(periodKey === "7d"){
      const d = new Date(now); d.setDate(d.getDate()-6);
      return { desde: startOfDay(d), hasta: endOfDay(now) };
    }
    if(periodKey === "30d"){
      const d = new Date(now); d.setDate(d.getDate()-29);
      return { desde: startOfDay(d), hasta: endOfDay(now) };
    }
    if(periodKey === "mes"){
      return { desde: new Date(now.getFullYear(), now.getMonth(), 1).getTime(), hasta: endOfDay(now) };
    }
    if(periodKey === "mesant"){
      const firstThisMonth = new Date(now.getFullYear(), now.getMonth(), 1);
      const lastMonthEnd = new Date(firstThisMonth.getTime() - 1);
      return { desde: new Date(lastMonthEnd.getFullYear(), lastMonthEnd.getMonth(), 1).getTime(), hasta: endOfDay(lastMonthEnd) };
    }
    // "custom"
    return {
      desde: customDesde ? new Date(customDesde+"T00:00:00").getTime() : null,
      hasta: customHasta ? new Date(customHasta+"T23:59:59.999").getTime() : null
    };
  }

  // Carga la librería de Excel (xlsx) recién cuando hace falta (exportar,
  // importar), en vez de siempre al abrir la app. Si ya está cargada, no
  // vuelve a pedirla; si dos llamados piden cargarla al mismo tiempo,
  // ambos esperan la misma promesa en vez de insertar el script dos veces.
  let xlsxLoadPromise = null;
  function ensureXLSXLoaded(){
    if(typeof XLSX !== "undefined") return Promise.resolve();
    if(xlsxLoadPromise) return xlsxLoadPromise;
    xlsxLoadPromise = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
      s.onload = () => resolve();
      s.onerror = () => { xlsxLoadPromise = null; reject(new Error("No se pudo cargar la librería de Excel")); };
      document.head.appendChild(s);
    });
    return xlsxLoadPromise;
  }

  // Genera y descarga un archivo Excel (.xlsx) con una o varias hojas.
  // sheetsDef: array de { name, rows } donde rows es un array de arrays (filas).
  async function exportWorkbook(sheetsDef, filename){
    try{
      await ensureXLSXLoaded();
    }catch(e){
      alert("No se pudo cargar la librería de Excel. Revisá tu conexión a internet e intentá de nuevo.");
      return;
    }
    const wb = XLSX.utils.book_new();
    sheetsDef.forEach(sd => {
      const ws = XLSX.utils.aoa_to_sheet(sd.rows);
      XLSX.utils.book_append_sheet(wb, ws, sd.name.substring(0,31));
    });
    XLSX.writeFile(wb, filename);
  }

  // Convierte una hoja de Excel en un array de objetos usando la primera fila como encabezados.
  function sheetToObjects(ws){
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:""});
    if(!rows.length) return [];
    const headers = rows[0].map(h=>String(h).trim());
    return rows.slice(1)
      .filter(r=>r.some(c=>String(c).trim()!==""))
      .map(r=>{
        const obj = {};
        headers.forEach((h,i)=>{ obj[h] = r[i]!==undefined ? r[i] : ""; });
        return obj;
      });
  }

  // Importa un archivo Excel (con el mismo formato que "Exportar todo") a Firestore.
  // Solo AGREGA lo que sea nuevo: no borra ni duplica lo que ya está cargado.
  async function importWorkbookFile(file){
    await ensureXLSXLoaded();
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:"array"});
    let addedCats = 0, addedProds = 0, addedEmps = 0, addedMovs = 0;

    // --- Productos y categorías ---
    if(wb.Sheets["Productos"]){
      const rows = sheetToObjects(wb.Sheets["Productos"]);
      const newCats = [];
      rows.forEach(r=>{
        const cat = String(r["Categoría"]||"").trim();
        if(cat && !categories.some(c=>c.name===cat) && !newCats.includes(cat)) newCats.push(cat);
      });
      if(newCats.length){
        categories.push(...newCats.map(n=>({name:n, roles:[]})));
        await saveConfig();
        addedCats = newCats.length;
      }
      const existingKey = new Set(products.map(p=>p.name+"|"+p.category));
      const toAdd = [];
      rows.forEach(r=>{
        const name = String(r["Producto"]||"").trim();
        const medida = String(r["Medida"]||"").trim() || "Unidad";
        const category = String(r["Categoría"]||"").trim();
        if(!name || !category) return;
        const key = name+"|"+category;
        if(existingKey.has(key)) return;
        existingKey.add(key);
        toAdd.push({name, medida, category});
      });
      for(let i=0;i<toAdd.length;i+=400){
        const chunk = toAdd.slice(i, i+400);
        const batch = db.batch();
        const refs = chunk.map(p=>{ const ref = db.collection("products").doc(); batch.set(ref, p); return ref; });
        await batch.commit();
        chunk.forEach((p,idx)=> products.push({ id: refs[idx].id, ...p }));
      }
      addedProds = toAdd.length;
    }

    // --- Empleados ---
    if(wb.Sheets["Empleados"]){
      const rows = sheetToObjects(wb.Sheets["Empleados"]);
      const existingNames = new Set(employees.map(e=>e.name));
      const toAdd = [];
      rows.forEach(r=>{
        const name = String(r["Nombre"]||"").trim();
        const pin = String(r["PIN"]||"").trim();
        const role = String(r["Rol"]||"").trim();
        if(!name || existingNames.has(name)) return;
        existingNames.add(name);
        toAdd.push({name, pin, role});
      });
      for(let i=0;i<toAdd.length;i+=400){
        const chunk = toAdd.slice(i, i+400);
        const batch = db.batch();
        const refs = chunk.map(e=>{ const ref = db.collection("employees").doc(); batch.set(ref, e); return ref; });
        await batch.commit();
        chunk.forEach((e,idx)=> employees.push({ id: refs[idx].id, ...e }));
      }
      addedEmps = toAdd.length;
    }

    // --- Movimientos ---
    if(wb.Sheets["Movimientos"]){
      const rows = sheetToObjects(wb.Sheets["Movimientos"]);
      const empByName = new Map(employees.map(e=>[e.name, e]));
      const toAdd = [];
      rows.forEach(r=>{
        const product = String(r["Producto"]||"").trim();
        const qty = parseInt(r["Cantidad"], 10);
        if(!product || !qty) return;
        const employeeName = String(r["Empleado"]||"").trim();
        const category = String(r["Categoría"]||"").trim();
        const area = String(r["Área"]||"").trim();
        let ts = Number(r["Timestamp"]);
        if(!ts || isNaN(ts)) ts = Date.now();
        const emp = empByName.get(employeeName);
        toAdd.push({
          employeeId: emp ? emp.id : "", employeeName: employeeName || "Desconocido",
          product, category, qty, type:"Salida", area, ts
        });
      });
      for(let i=0;i<toAdd.length;i+=400){
        const chunk = toAdd.slice(i, i+400);
        const batch = db.batch();
        const refs = chunk.map(m=>{ const ref = db.collection("movements").doc(); batch.set(ref, m); return ref; });
        await batch.commit();
        chunk.forEach((m,idx)=> movements.push({ id: refs[idx].id, ...m }));
      }
      addedMovs = toAdd.length;
    }

    return { addedCats, addedProds, addedEmps, addedMovs };
  }

  // Agrupa movimientos por producto+categoría y suma las cantidades retiradas.
  function buildProductSummary(rows){
    const map = new Map();
    rows.forEach(m=>{
      const key = m.product + "|" + (m.category||"");
      if(!map.has(key)) map.set(key, {product:m.product, category:m.category||"", total:0, count:0});
      const entry = map.get(key);
      entry.total += m.qty;
      entry.count += 1;
    });
    return Array.from(map.values());
  }

  // Lleva el conteo de intentos fallidos de PIN por empleado y bloquea
  // el usuario tras 5 intentos incorrectos seguidos. Se guarda en Firestore
  // (colección "loginAttempts", un documento por empleado) en vez de en
  // localStorage: así el bloqueo es real y no se pierde ni se puede evadir
  // recargando la página, cerrando el navegador, usando modo privado o
  // probando desde otro dispositivo. Los datos se traen una sola vez al
  // arrancar la app (ver loadAll) y desde ahí se mantienen en memoria,
  // sincronizando cada cambio con Firestore.
  const MAX_LOGIN_ATTEMPTS = 5;
  let loginAttempts = {}; // { [empId]: { count, locked } }, cargado en loadAll()
  function isEmployeeLocked(empId){
    return !!(loginAttempts[empId] && loginAttempts[empId].locked);
  }
  async function registerFailedAttempt(empId){
    const current = loginAttempts[empId] || { count:0, locked:false };
    current.count += 1;
    if(current.count >= MAX_LOGIN_ATTEMPTS) current.locked = true;
    loginAttempts[empId] = current;
    try{
      await db.collection("loginAttempts").doc(empId).set(current);
    }catch(e){
      // A diferencia del viejo esquema con localStorage, acá si falla el
      // guardado se avisa: mejor que el empleado sepa que puede haber
      // problemas de conexión, en vez de que el bloqueo "desaparezca" sin
      // explicación en el próximo intento.
      showToast("No se pudo guardar el intento fallido (revisá la conexión).", "error");
    }
    return current;
  }
  async function clearFailedAttempts(empId){
    if(!loginAttempts[empId]) return;
    delete loginAttempts[empId];
    try{
      await db.collection("loginAttempts").doc(empId).delete();
    }catch(e){
      showToast("No se pudo limpiar el registro de intentos (revisá la conexión).", "error");
    }
  }
  async function unlockEmployee(empId){
    await clearFailedAttempts(empId);
  }

  // =======================================================================
  // 2) CARGA Y SEED INICIAL DE DATOS EN FIRESTORE
  // =======================================================================
  async function loadAll(){
    try{
      const configRef = db.collection("meta").doc("config");

      // Productos y el historial de movimientos no hacen falta para
      // mostrar el login (solo se usan al elegir un producto o al entrar
      // al panel de admin), así que se piden en paralelo pero SIN esperarlos
      // acá: arrancan a descargarse ya mismo en segundo plano (ver
      // loadBackgroundData) y la pantalla de login no los espera.
      backgroundDataPromise = loadBackgroundData().catch(err => {
        showToast("No se pudieron cargar productos y movimientos: " + (err.message || err), "error");
      });

      // Lo único que bloquea el login: config, empleados, e intentos de
      // login (chico, solo tiene entradas de empleados con intentos
      // fallidos). Se piden en paralelo entre sí para que la carga inicial
      // no espere una respuesta tras otra. "deletedMovStats" queda afuera
      // a propósito: solo se usa en la pestaña Estadísticas del admin,
      // así que se trae recién ahí (ver ensureDeletedStatsLoaded).
      const [configSnap, empSnap, laSnap] = await Promise.all([
        configRef.get(),
        db.collection("employees").get(),
        db.collection("loginAttempts").get()
      ]);

      if(!configSnap.exists){
        config = { adminPin: "1982", stock: {} };
        categories = DEFAULT_CATEGORIES.map(c=>({...c}));
        await configRef.set({ adminPin: config.adminPin, stock: config.stock, categories });
      }else{
        const data = configSnap.data();
        config = { adminPin: data.adminPin || "1982", stock: data.stock || {} };
        if(data.categories && data.categories.length){
          // Compatibilidad: si vienen como strings (formato viejo), migrarlas
          // al nuevo formato {name, roles} usando el mapeo legado.
          categories = data.categories.map(c => typeof c === "string" ? migrateLegacyCategory(c) : c);
        }else{
          categories = DEFAULT_CATEGORIES.map(c=>({...c}));
        }
        // Migración: instalaciones ya existentes tenían a Desayunador como
        // rol especial fuera del sistema de categorías. Si todavía no tienen
        // la categoría "Desayunador" guardada, se agrega ahora para que el
        // empleado con ese rol la vea en el asistente normal.
        if(!categories.some(c=>c.name==="Desayunador")){
          categories.push({name:"Desayunador", roles:["Desayunador"]});
          await saveConfig();
        }
      }

      if(empSnap.empty){
        const batch = db.batch();
        DEFAULT_EMPLOYEES.forEach(([name, pin]) => {
          const ref = db.collection("employees").doc();
          batch.set(ref, { name, pin, role: "" });
        });
        await batch.commit();
        const refreshed = await db.collection("employees").get();
        employees = refreshed.docs.map(d => ({ id: d.id, ...d.data() }));
      }else{
        employees = empSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      }

      loginAttempts = {};
      laSnap.docs.forEach(d => { loginAttempts[d.id] = d.data(); });

      // Si había una sesión guardada en este navegador, se restaura
      // en vez de mostrar la pantalla de login. La de administrador
      // nunca se guarda, así que siempre va a pedir el PIN de nuevo.
      const session = readSession();
      if(session && session.type === "user"){
        const emp = employees.find(e => e.id === session.empId);
        if(emp){
          currentUser = { id: emp.id, name: emp.name, role: emp.role || "" };
          view = "form";
        }else{
          clearSession();
        }
      }

      render();
    }catch(err){
      app.innerHTML = `
        <div class="topbar"><h1>Control de Stock</h1><p class="sub">Error de conexión</p></div>
        <section><div class="card"><div class="msg error">
          No se pudo conectar con la base de datos: ${esc(err.message || err)}.
          Revisá la configuración de Firebase y las reglas de Firestore.
        </div></div></section>
      `;
    }
  }

  // Carga productos y los movimientos de los últimos RECENT_MOVEMENTS_DAYS
  // días. Se dispara en paralelo con la carga crítica de loadAll() y NO
  // bloquea la pantalla de login; si el usuario llega a un paso que
  // necesita estos datos antes de que termine, esa pantalla espera con un
  // mensaje de carga (ver whenBackgroundDataReady).
  async function loadBackgroundData(){
    const cutoffTs = Date.now() - RECENT_MOVEMENTS_DAYS * 24 * 60 * 60 * 1000;
    const [prodSnap, movSnap, desayProdSnap, aperturasSnap] = await Promise.all([
      db.collection("products").get(),
      db.collection("movements").where("ts", ">=", cutoffTs).get(),
      db.collection("desayunoProductos").get(),
      db.collection("aperturas").get()
    ]);
    products = prodSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    movements = movSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    movementsLoadedSinceTs = cutoffTs;
    aperturas = aperturasSnap.docs.map(d => ({ id: d.id, ...d.data() }));

    if(desayProdSnap.empty){
      const batch = db.batch();
      const refs = DEFAULT_DESAYUNO.map(name => {
        const ref = db.collection("desayunoProductos").doc();
        batch.set(ref, { name });
        return ref;
      });
      await batch.commit();
      desayunoProductos = refs.map((ref, i) => ({ id: ref.id, name: DEFAULT_DESAYUNO[i] }));
    }else{
      desayunoProductos = desayProdSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    }

    async function seedCategory(catName, defaults){
      const hasAny = products.some(p => p.category === catName);
      if(!hasAny && defaults.length){
        const batch = db.batch();
        defaults.forEach(([name, medida]) => {
          const ref = db.collection("products").doc();
          batch.set(ref, { name, medida, category: catName });
        });
        await batch.commit();
        return true;
      }
      return false;
    }
    // Las 3 categorías por defecto se revisan/siembran en paralelo,
    // ya que son independientes entre sí.
    const seededAny = (await Promise.all([
      seedCategory("Productos de limpieza", DEFAULT_CLEANING),
      seedCategory("Mantenimiento", DEFAULT_MAINTENANCE),
      seedCategory("Bebidas", DEFAULT_BEVERAGES)
    ])).some(Boolean);

    // Solo se vuelve a pedir la lista de productos si realmente se
    // sembró algo nuevo (caso raro, típicamente solo la primera vez).
    if(seededAny){
      const refreshedProd = await db.collection("products").get();
      products = refreshedProd.docs.map(d => ({ id: d.id, ...d.data() }));
    }

    backgroundDataReady = true;
    // Si la pantalla actual ya estaba esperando estos datos (el empleado
    // llegó al paso de elegir producto, o se abrió el panel de admin,
    // antes de que terminara esta carga), se refresca ahora que están.
    if((view === "form" && (formStep === "producto" || formStep === "lista")) || view === "admin"){
      render();
    }
  }

  // Trae de Firestore los movimientos anteriores a lo que ya está cargado
  // en memoria (ver RECENT_MOVEMENTS_DAYS / movementsLoadedSinceTs), para
  // cuando el admin filtra por una fecha "Desde" más vieja que eso. Si el
  // rango pedido ya está cubierto, no hace ningún pedido de más.
  async function ensureMovementsLoadedFrom(desdeTs){
    const neededFrom = desdeTs === null ? 0 : desdeTs;
    if(movementsLoadedSinceTs === null || neededFrom >= movementsLoadedSinceTs) return false;
    const snap = await db.collection("movements")
      .where("ts", ">=", neededFrom)
      .where("ts", "<", movementsLoadedSinceTs)
      .get();
    const existingIds = new Set(movements.map(m => m.id));
    snap.docs.forEach(d => {
      if(!existingIds.has(d.id)) movements.push({ id: d.id, ...d.data() });
    });
    movementsLoadedSinceTs = neededFrom;
    return true;
  }

  async function saveConfig(){
    await db.collection("meta").doc("config").set({
      adminPin: config.adminPin, stock: config.stock, categories
    });
  }
  async function addEmployee(name, pin, role){
    const ref = await db.collection("employees").add({ name, pin, role: role || "" });
    employees.push({ id: ref.id, name, pin, role: role || "" });
  }
  async function updateEmployee(id, data){
    await db.collection("employees").doc(id).update(data);
  }
  async function deleteEmployee(id){
    await db.collection("employees").doc(id).delete();
    employees = employees.filter(e => e.id !== id);
  }
  async function addProduct(name, medida, category){
    const ref = await db.collection("products").add({ name, medida, category });
    products.push({ id: ref.id, name, medida, category });
  }
  async function updateProduct(id, data){
    await db.collection("products").doc(id).update(data);
  }
  async function deleteProduct(id){
    await db.collection("products").doc(id).delete();
    products = products.filter(p => p.id !== id);
  }
  async function addMovement(mov){
    const ref = await db.collection("movements").add(mov);
    movements.push({ id: ref.id, ...mov });
  }
  async function addDesayunoProducto(name){
    const ref = await db.collection("desayunoProductos").add({ name });
    desayunoProductos.push({ id: ref.id, name });
  }
  async function updateDesayunoProducto(id, name){
    await db.collection("desayunoProductos").doc(id).update({ name });
  }
  async function deleteDesayunoProducto(id){
    await db.collection("desayunoProductos").doc(id).delete();
    desayunoProductos = desayunoProductos.filter(p => p.id !== id);
  }
  // Registra una apertura: guarda automáticamente quién la hizo y la
  // fecha/hora exacta (ts = Date.now()).
  async function addApertura(product){
    const ap = { product, employeeId: currentUser.id, employeeName: currentUser.name, ts: Date.now() };
    const ref = await db.collection("aperturas").add(ap);
    aperturas.push({ id: ref.id, ...ap });
    return aperturas[aperturas.length-1];
  }
  async function deleteApertura(id){
    await db.collection("aperturas").doc(id).delete();
    aperturas = aperturas.filter(a => a.id !== id);
  }
  async function registerDeletedMovement(mov){
    const key = mov.employeeId || "sin_empleado";
    const name = mov.employeeName || "Desconocido";
    await db.collection("deletedMovStats").doc(key).set({
      employeeName: name,
      count: firebase.firestore.FieldValue.increment(1)
    }, { merge: true });
    deletedStats[key] = { employeeName: name, count: (deletedStats[key]?.count || 0) + 1 };
  }
  // Trae "deletedMovStats" desde Firestore recién la primera vez que hace
  // falta (pestaña Estadísticas), en vez de siempre al abrir la app.
  async function ensureDeletedStatsLoaded(){
    if(deletedStatsLoaded) return;
    const snap = await db.collection("deletedMovStats").get();
    deletedStats = {};
    snap.docs.forEach(d => { deletedStats[d.id] = d.data(); });
    deletedStatsLoaded = true;
  }
  const SELF_DELETE_WINDOW_MS = 5 * 60 * 1000; // 5 minutos para que un empleado borre su propio movimiento
  async function deleteMovement(id){
    const mov = movements.find(m => m.id === id);
    await db.collection("movements").doc(id).delete();
    movements = movements.filter(m => m.id !== id);
    if(mov) await registerDeletedMovement(mov);
  }
  async function deleteAllMovements(){
    // "Borrar todos" tiene que borrar TODO el historial, no solo lo que
    // esté cargado en memoria (que puede ser nada más que los últimos
    // RECENT_MOVEMENTS_DAYS días). Se completa la carga si hace falta.
    await ensureMovementsLoadedFrom(0);
    const all = movements.slice();
    for(let i=0;i<all.length;i+=400){
      const chunk = all.slice(i, i+400);
      const batch = db.batch();
      chunk.forEach(m => batch.delete(db.collection("movements").doc(m.id)));
      await batch.commit();
    }
    movements = [];
    movementsLoadedSinceTs = 0; // ya no queda nada más viejo por traer
    // "Borrar todos" no cuenta como borrado individual: se resetea por
    // completo el contador de movimientos borrados por empleado.
    const statsSnap = await db.collection("deletedMovStats").get();
    const statsDocs = statsSnap.docs.slice();
    for(let i=0;i<statsDocs.length;i+=400){
      const chunk = statsDocs.slice(i, i+400);
      const batch = db.batch();
      chunk.forEach(d => batch.delete(d.ref));
      await batch.commit();
    }
    deletedStats = {};
    deletedStatsLoaded = true;
  }

  // =======================================================================
  // LOGIN (empleado)
  // =======================================================================
  function renderLogin(){
    app.innerHTML = `
      <div class="topbar"><h1>Control de Stock</h1><p class="sub">Depósito del hotel</p></div>
      <section>
        <div class="card">
          <h2>Ingresá con tu usuario</h2>
          <div id="loginMsg"></div>
          <label>Tu nombre</label>
          <select id="empSelect">
            ${employees.slice().sort((a,b)=>a.name.localeCompare(b.name,'es',{sensitivity:'base'})).map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join("")}
          </select>
          <label>Tu PIN personal</label>
          <input type="tel" inputmode="numeric" maxlength="4" id="pinInput" placeholder="••••">
          <button class="btn btn-primary" id="loginBtn">Ingresar</button>
        </div>
        <div class="footer-link"><button id="goAdmin">Administración</button></div>
      </section>
    `;
    restrictPinInput(document.getElementById("pinInput"));
    document.getElementById("loginBtn").onclick = async () => {
      const loginBtn = document.getElementById("loginBtn");
      const empId = document.getElementById("empSelect").value;
      const pinInput = document.getElementById("pinInput");
      const pin = pinInput.value.trim();
      const emp = employees.find(e=>e.id===empId);
      const msg = document.getElementById("loginMsg");
      if(pin === ""){
        // No se escribió nada: se marca el campo y se avisa, pero esto
        // NO cuenta como intento fallido (no se toca registerFailedAttempt).
        msg.innerHTML = `<div class="msg info">Escribí tu PIN para ingresar.</div>`;
        pinInput.classList.add("input-alert");
        pinInput.focus();
        pinInput.addEventListener("input", () => pinInput.classList.remove("input-alert"), { once:true });
        return;
      }
      if(emp && isEmployeeLocked(emp.id)){
        msg.innerHTML = `<div class="msg error">Usuario bloqueado por 5 intentos fallidos seguidos. Pedile a un administrador que lo desbloquee.</div>`;
        return;
      }
      if(!emp || pin !== emp.pin){
        if(emp){
          loginBtn.disabled = true;
          const attempt = await registerFailedAttempt(emp.id);
          loginBtn.disabled = false;
          if(attempt.locked){
            msg.innerHTML = `<div class="msg error">Usuario bloqueado por 5 intentos fallidos seguidos. Pedile a un administrador que lo desbloquee.</div>`;
          } else {
            const restantes = MAX_LOGIN_ATTEMPTS - attempt.count;
            msg.innerHTML = `<div class="msg error">PIN incorrecto. Te queda${restantes===1?"":"n"} ${restantes} intento${restantes===1?"":"s"} antes de bloquear el usuario.</div>`;
          }
        } else {
          msg.innerHTML = `<div class="msg error">PIN incorrecto. Volvé a intentar o pedile a un administrador que revise tu PIN.</div>`;
        }
        return;
      }
      await clearFailedAttempts(emp.id);
      currentUser = { id: emp.id, name: emp.name, role: emp.role || "" };
      view = "form";
      formStep = "categoria";
      selectedCategory = null;
      selectedProductId = null;
      qtyValue = 1;
      areaValue = "";
      areaSelected = "";
      saveSession({ type:"user", empId: emp.id });
      render();
    };
    document.getElementById("goAdmin").onclick = () => { view = "admin-login"; render(); };
  }

  // Cierra la sesión del empleado y reinicia el asistente de retiro para la próxima vez.
  function doLogout(){
    currentUser = null;
    view = "login";
    formStep = "categoria";
    selectedCategory = null;
    selectedProductId = null;
    qtyValue = 1;
    areaValue = "";
    areaSelected = "";
    clearSession();
    render();
  }

  // =======================================================================
  // FORM (registrar retiro) — asistente paso a paso, pensado para que lo
  // use gente mayor: un paso a la vez, botones grandes y bien diferenciados.
  //   categoria -> producto -> cantidad (con el botón de registrar) -> lista
  // =======================================================================
  function topbarWizard(subtitle){
    return `
      <div class="topbar">
        <div class="row">
          <div><h1>Hola, ${esc(currentUser.name)}</h1><p class="sub">${esc(subtitle)}</p></div>
          <button class="link" id="logoutBtn">Cerrar sesión</button>
        </div>
      </div>
    `;
  }

  function getMisMovs(){
    return movements
      .filter(m => m.employeeId === currentUser.id)
      .sort((a,b)=>b.ts-a.ts)
      .slice(0,5);
  }

  function renderForm(){
    const allowedCats = getAllowedCategories(currentUser.role);
    if(!allowedCats.length){
      app.innerHTML = `
        ${topbarWizard("Registrar retiro de stock")}
        <section>
          <div class="card">
            <div class="msg info">Todavía no tenés categorías asignadas. Pedile a un administrador que te asigne un rol en la sección Empleados.</div>
          </div>
        </section>
      `;
      document.getElementById("logoutBtn").onclick = doLogout;
      return;
    }
    if(!selectedCategory || !allowedCats.includes(selectedCategory)) selectedCategory = null;

    if(formStep === "producto" && !selectedCategory) formStep = "categoria";
    if(formStep === "cantidad" && !selectedProductId) formStep = "categoria";

    // Los pasos "producto" y "lista" necesitan products/movements, que se
    // cargan en segundo plano (ver loadBackgroundData). Si el empleado
    // llega hasta acá antes de que termine esa carga (muy rápido tocando
    // botones), se espera con un cartel en vez de mostrar datos a medias.
    if((formStep === "producto" || formStep === "lista") && !backgroundDataReady){
      app.innerHTML = `
        ${topbarWizard("Un momento...")}
        <section><div class="card"><div class="empty">Cargando productos y movimientos...</div></div></section>
      `;
      document.getElementById("logoutBtn").onclick = doLogout;
      whenBackgroundDataReady(() => { if(view === "form") render(); });
      return;
    }

    if(formStep === "producto") renderFormProducto(allowedCats);
    else if(formStep === "cantidad") renderFormCantidad();
    else if(formStep === "lista") renderFormLista();
    else renderFormCategoria(allowedCats);
  }

  // Paso 1: carteles gigantes de colores bien distintos, uno por categoría.
  function renderFormCategoria(allowedCats){
    app.innerHTML = `
      ${topbarWizard("Elegí una categoría")}
      <section>
        <div class="cat-cards">
          ${allowedCats.map(c=>{
            const col = getCategoryColor(c);
            return `
              <button type="button" class="cat-card" data-cat="${esc(c)}" style="background:${col.bg};color:${col.text};">
                <span class="cat-card-icon">${getCategoryIcon(c)}</span>
                <span class="cat-card-label">${esc(c)}</span>
              </button>
            `;
          }).join("")}
        </div>
        <div class="footer-link"><button id="verMovBtn">Ver mis últimos movimientos</button></div>
      </section>
    `;
    document.getElementById("logoutBtn").onclick = doLogout;
    document.getElementById("verMovBtn").onclick = () => { formStep = "lista"; render(); };
    Array.from(document.querySelectorAll(".cat-card")).forEach(b=>{
      b.onclick = () => {
        selectedCategory = b.dataset.cat;
        selectedProductId = null;
        formStep = "producto";
        render();
      };
    });
  }

  // Paso 2: lista de productos de la categoría elegida, en botones grandes.
  // Para la categoría "Desayunador" es la misma pantalla y el mismo estilo
  // de botones, solo que la lista sale de "desayunoProductos" (sin medida)
  // y al tocar uno se pasa a confirmar la apertura (ver renderFormCantidad).
  function renderFormProducto(allowedCats){
    const esDesayunador = selectedCategory === "Desayunador";
    const reqCount = {};
    movements.forEach(m => { reqCount[m.product] = (reqCount[m.product]||0) + 1; });
    const prodsInCat = esDesayunador
      ? desayunoProductos.slice().sort((a,b)=> a.name.localeCompare(b.name,"es",{sensitivity:"base"}))
      : products.filter(p=>p.category===selectedCategory)
          .sort((a,b)=> (reqCount[b.name]||0) - (reqCount[a.name]||0) || a.name.localeCompare(b.name,"es",{sensitivity:"base"}));

    app.innerHTML = `
      ${topbarWizard(selectedCategory)}
      <section>
        <button type="button" class="wizard-back" id="backToCat">← Volver a categorías</button>
        <div class="prod-list">
          ${prodsInCat.length ? prodsInCat.map(p=>`
            <button type="button" class="prod-card" data-id="${esc(p.id)}">
              <span>${esc(p.name)}</span>
              <span class="prod-card-medida">${esDesayunador ? "Registrar apertura" : esc(p.medida)}</span>
            </button>
          `).join("") : `<div class="empty">${esDesayunador ? "Todavía no hay productos configurados. Pedile a un administrador que los cargue." : "No hay productos cargados en esta categoría."}</div>`}
        </div>
      </section>
    `;
    document.getElementById("logoutBtn").onclick = doLogout;
    document.getElementById("backToCat").onclick = () => { formStep = "categoria"; render(); };
    Array.from(document.querySelectorAll(".prod-card")).forEach(b=>{
      b.onclick = () => {
        selectedProductId = b.dataset.id;
        qtyValue = 1;
        areaValue = "";
        areaSelected = "";
        formStep = "cantidad";
        render();
      };
    });
  }

  // Paso 3: cuántos retira, con botones grandes de + y -, y el cartel de
  // "Registrar movimiento" ya mismo abajo (sin un paso de confirmación aparte).
  // Para la categoría "Desayunador" no hay cantidad ni área: se pasa a
  // renderFormConfirmarApertura, que solo pide confirmar el producto.
  function renderFormCantidad(){
    if(selectedCategory === "Desayunador"){ renderFormConfirmarApertura(); return; }
    const prod = products.find(p=>p.id===selectedProductId);
    if(!prod){ formStep = "categoria"; render(); return; }
    const esBebidas = prod.category === "Bebidas";
    const areaBlockHTML = esBebidas ? `
          <label style="margin-top:6px;">Área / destino</label>
          <div class="area-opts" id="areaOpts">
            <button type="button" class="area-opt-btn${areaSelected==='Venta'?' active':''}" data-val="Venta">VENTA</button>
            <button type="button" class="area-opt-btn${areaSelected==='Dirigentes'?' active':''}" data-val="Dirigentes">DIRIGENTES</button>
            <button type="button" class="area-opt-btn${areaSelected==='Otro'?' active':''}" data-val="Otro">OTRO</button>
          </div>
          ${areaSelected==='Otro' ? `<input type="text" id="areaInput" placeholder="Especificá el área / destino..." value="${esc(areaValue)}">` : ``}
    ` : `
          <label style="margin-top:6px;">Área / destino (opcional)</label>
          <input type="text" id="areaInput" placeholder="Ej: Habitaciones, Cocina..." value="${esc(areaValue)}">
    `;
    app.innerHTML = `
      ${topbarWizard("¿Cuántos retirás?")}
      <section>
        <button type="button" class="wizard-back" id="backToProd">← Volver a productos</button>
        <div class="card" style="text-align:center;">
          <h2 style="font-size:20px;text-align:center;">${esc(prod.name)} (${esc(prod.medida)})</h2>
          <div class="qty-wizard">
            <button type="button" class="qty-btn" id="qtyMinus">−</button>
            <div class="qty-display" id="qtyDisplay">${qtyValue}</div>
            <button type="button" class="qty-btn" id="qtyPlus">+</button>
          </div>
          ${areaBlockHTML}
        </div>
        <button type="button" class="confirm-giant" id="confirmBtn">REGISTRAR MOVIMIENTO</button>
        <div id="confirmMsg" style="padding:0 20px;"></div>
      </section>
    `;
    document.getElementById("logoutBtn").onclick = doLogout;
    document.getElementById("backToProd").onclick = () => { formStep = "producto"; render(); };
    const display = document.getElementById("qtyDisplay");
    const minusBtn = document.getElementById("qtyMinus");
    document.getElementById("qtyPlus").onclick = () => { qtyValue++; display.textContent = qtyValue; minusBtn.disabled = qtyValue<=1; };
    minusBtn.disabled = qtyValue<=1;
    minusBtn.onclick = () => { if(qtyValue>1){ qtyValue--; display.textContent = qtyValue; minusBtn.disabled = qtyValue<=1; } };

    if(esBebidas){
      Array.from(document.querySelectorAll(".area-opt-btn")).forEach(b=>{
        b.onclick = () => {
          areaSelected = b.dataset.val;
          if(areaSelected !== "Otro"){ areaValue = areaSelected; }
          else { areaValue = ""; }
          render();
        };
      });
    }
    const areaInput = document.getElementById("areaInput");

    document.getElementById("confirmBtn").onclick = async () => {
      const btn = document.getElementById("confirmBtn");
      const msg = document.getElementById("confirmMsg");
      if(esBebidas){
        if(!areaSelected){
          msg.innerHTML = `<div class="msg error">Elegí una opción de área / destino.</div>`;
          return;
        }
        areaValue = areaSelected === "Otro" ? (areaInput ? areaInput.value.trim() : "") : areaSelected;
        if(areaSelected === "Otro" && !areaValue){
          msg.innerHTML = `<div class="msg error">Escribí el área / destino.</div>`;
          return;
        }
      } else {
        areaValue = areaInput.value.trim();
      }
      const mov = {
        employeeId: currentUser.id, employeeName: currentUser.name,
        product: prod.name, category: prod.category,
        qty: qtyValue, type: "Salida", area: areaValue, ts: Date.now()
      };

  // (ver renderFormListaAperturas).
  function renderFormLista(){

    const misMovs = getMisMovs();
    const showSuccess = lastMovSuccess;
    lastMovSuccess = false;
    app.innerHTML = `

          <h2>Tus últimos movimientos</h2>
          <div id="misMovs">
            ${misMovs.length ? misMovs.map(m => {
              const puedeBorrar = (Date.now() - m.ts) < SELF_DELETE_WINDOW_MS;
              return `
              <div class="movrow">
                <div><div>${esc(m.product)}</div><div class="meta">${esc(m.category||"")} · ${fmtDate(m.ts)}${m.area? " · "+esc(m.area):""}</div></div>

                  <div class="qty">-${m.qty}</div>

            `;

          </div>
        </div>
      </section>

      formStep = "categoria";
      render();

    Array.from(document.querySelectorAll("[data-action='delMisMov']")).forEach(btn=>{
      btn.onclick = async () => {
        const mov = movements.find(m => m.id === btn.dataset.id);
        if(!mov || (Date.now() - mov.ts) >= SELF_DELETE_WINDOW_MS){
          showToast("Ya pasaron los 5 minutos: pedile a un administrador que lo borre", "error");
          render();
          return;
        }
        if(!confirm("¿Borrar este movimiento? Esta acción no se puede deshacer.")) return;
        btn.disabled = true;
        await deleteMovement(btn.dataset.id);
        showToast("Movimiento borrado", "ok");
        render();
      };
    });

    // Vuelve a renderizar cuando se cumplan los 5 minutos del movimiento más
    // reciente, para que el botón "Borrar" desaparezca solo sin recargar.
    if(misMovs.length){
      const msRestantes = SELF_DELETE_WINDOW_MS - (Date.now() - misMovs[0].ts);
      if(msRestantes > 0 && msRestantes < SELF_DELETE_WINDOW_MS){
        clearTimeout(window.__misMovsTimer);
        window.__misMovsTimer = setTimeout(() => { if(view==="form" && formStep==="lista") render(); }, msRestantes + 500);
      }
    }
  }

    // acá antes de que termine esa carga, se espera con un cartel.
    if(!backgroundDataReady){
      app.innerHTML = `
        <div class="topbar"><h1>Administración</h1><p class="sub">Cargando datos...</p></div>
        <section><div class="card"><div class="empty">Cargando productos y movimientos, un momento...</div></div></section>
      `;
      whenBackgroundDataReady(() => { if(view === "admin") render(); });

    }
    app.innerHTML = `
      <div class="topbar">
        <div class="row">
          <div><h1>Administración</h1><p class="sub">Vista general de stock</p></div>
          <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;">

          <button data-tab="estadisticas" class="${adminTab==='estadisticas'?'active':''}">Estadísticas</button>

          <button data-tab="desayunador" class="${adminTab==='desayunador'?'active':''}">Desayunador</button>
        </div>
        <div id="adminContent"></div>
      </section>
    `;

    document.getElementById("exportAllBtn").onclick = async () => {
      const btn = document.getElementById("exportAllBtn");
      const originalText = btn.textContent;
      // "Exportar todo" tiene que incluir el historial completo de
      // movimientos, no solo los últimos 60 días que están en memoria.
      if(movementsLoadedSinceTs > 0){
        btn.textContent = "Cargando historial completo...";
        try{
          await ensureMovementsLoadedFrom(0);
        }catch(err){
          alert("No se pudo traer el historial completo: " + (err.message || err));
          btn.textContent = originalText;
          return;
        }
        btn.textContent = originalText;
      }
      const movRows = movements.slice().sort((a,b)=>a.ts-b.ts);
      const movAoa = [["Fecha","Empleado","Categoría","Producto","Cantidad","Área","Timestamp"]];
      movRows.forEach(m => movAoa.push([fmtDate(m.ts), m.employeeName, m.category||"", m.product, m.qty, m.area||"", m.ts]));

      const summary = buildProductSummary(movements)
        .sort((a,b)=> (a.category||"").localeCompare(b.category||"") || a.product.localeCompare(b.product));
      const resAoa = [["Categoría","Producto","Cantidad de retiros","Total retirado"]];
      summary.forEach(s => resAoa.push([s.category||"", s.product, s.count, s.total]));

      const prodAoa = [["Categoría","Producto","Medida"]];
      categories.forEach(cat => {
        products.filter(p=>p.category===cat.name).forEach(p => prodAoa.push([cat.name, p.name, p.medida]));
      });
      products.filter(p=>!categories.some(c=>c.name===p.category)).forEach(p => prodAoa.push([p.category||"", p.name, p.medida]));

      const empAoa = [["Nombre","PIN","Rol"]];
      employees.forEach(e => empAoa.push([e.name, e.pin, e.role || ""]));

      exportWorkbook([
        {name:"Movimientos", rows: movAoa},
        {name:"Resumen por producto", rows: resAoa},
        {name:"Productos", rows: prodAoa},
        {name:"Empleados", rows: empAoa}
      ], "control_stock_completo.xlsx");

        alert("No se pudo importar el archivo: " + (err.message || err));

      b.onclick = () => { adminTab = b.dataset.tab; render(); };

    if(adminTab === "empleados") renderAdminEmpleados(content);
    if(adminTab === "desayunador") renderAdminDesayunador(content);
  }

  function renderAdminMovimientos(content){

        </div>

    async function getFiltered(){
      const fe = document.getElementById("fEmp").value;
      const fc = document.getElementById("fCat").value;
      const fd = document.getElementById("fDesde").value;
      const fh = document.getElementById("fHasta").value;
      const desdeTs = fd ? new Date(fd+"T00:00:00").getTime() : null;
      const hastaTs = fh ? new Date(fh+"T23:59:59.999").getTime() : null;
      if(desdeTs !== null && desdeTs < movementsLoadedSinceTs){
        await ensureMovementsLoadedFrom(desdeTs);
      }
      return movements
        .filter(m => (fe==="Todos"||m.employeeName===fe) && (fc==="Todas"||m.category===fc)
          && (desdeTs===null || m.ts >= desdeTs) && (hastaTs===null || m.ts <= hastaTs))
        .sort((a,b)=>b.ts-a.ts);
    }
    async function drawRows(){
      const fd = document.getElementById("fDesde").value;
      const desdeTsCheck = fd ? new Date(fd+"T00:00:00").getTime() : null;
      const tbody = document.getElementById("movTbody");
      if(desdeTsCheck !== null && desdeTsCheck < movementsLoadedSinceTs){
        tbody.innerHTML = `<tr><td colspan="6"><div class="empty">Cargando movimientos de ese rango de fechas...</div></td></tr>`;
      }
      let rows;
      try{
        rows = await getFiltered();
      }catch(err){
        tbody.innerHTML = `<tr><td colspan="6"><div class="msg error">No se pudo cargar ese rango: ${esc(err.message||err)}</div></td></tr>`;
        return;
      }
      tbody.innerHTML = rows.length ? rows.map(m=>`

          <td>${fmtDate(m.ts)}</td><td>${esc(m.employeeName)}</td><td>${esc(m.category||"")}</td>
          <td>${esc(m.product)}</td><td class="estado-reponer">-${m.qty}</td>

        btn.onclick = async () => {
          if(!confirm("¿Borrar este movimiento? Esta acción no se puede deshacer.")) return;
          try{
            await deleteMovement(btn.dataset.id);
            showToast("Movimiento eliminado", "ok");
          }catch(err){
            alert("No se pudo borrar: " + (err.message || err));
          }
          drawRows();
        };
      });
    }
    document.getElementById("fEmp").onchange = drawRows;
    document.getElementById("fCat").onchange = drawRows;
    document.getElementById("fDesde").onchange = drawRows;
    document.getElementById("fHasta").onchange = drawRows;
    document.getElementById("clearDatesBtn").onclick = () => {
      document.getElementById("fDesde").value = "";
      document.getElementById("fHasta").value = "";
      drawRows();
    };
    drawRows();

    document.getElementById("exportBtn").onclick = async () => {
      const rows = await getFiltered();
      const aoa = [["Fecha","Empleado","Categoría","Producto","Cantidad","Área","Timestamp"]];
      rows.slice().sort((a,b)=>a.ts-b.ts).forEach(m =>
        aoa.push([fmtDate(m.ts), m.employeeName, m.category||"", m.product, m.qty, m.area||"", m.ts])
      );
      exportWorkbook([{name:"Movimientos", rows: aoa}], "movimientos_stock.xlsx");
    };

    document.getElementById("deleteAllBtn").onclick = async () => {
      const btn = document.getElementById("deleteAllBtn");
      // Hay que conocer el total real (no solo lo cargado en memoria)
      // antes de avisar cuántos movimientos se van a borrar.

      await ensureMovementsLoadedFrom(0);
      btn.disabled = false;
      if(!movements.length){ alert("No hay movimientos cargados para borrar."); return; }
      if(!confirm(`Vas a borrar TODOS los movimientos registrados (${movements.length} en total). Esta acción no se puede deshacer. ¿Continuar?`)) return;
      const typed = prompt('Para confirmar, escribí BORRAR (en mayúsculas):');
      if(typed !== "BORRAR"){ alert("Cancelado. No se borró nada."); return; }
      try{
        await deleteAllMovements();
        showToast("Se borraron todos los movimientos", "ok");
        render();
      }catch(err){
        alert("No se pudo borrar: " + (err.message || err));
      }
    };
  }

  function renderAdminResumen(content){

            <label style="margin-bottom:4px;">Desde</label>
            <input type="date" id="rDesde" style="margin-bottom:0;">

        </div>
        <div style="max-height:460px;overflow:auto;">
          <table>
            <thead><tr><th>Producto</th><th>Retiros</th><th>Total retirado</th></tr></thead>
            <tbody id="resumenTbody"></tbody>
          </table>
        </div>
        <div style="margin-top:12px;"><button class="btn btn-secondary" id="resumenExportBtn">Descargar Excel</button></div>
      </div>
    `;

    async function getFiltered(){
      const fe = document.getElementById("rEmp").value;
      const fc = document.getElementById("rCat").value;
      const fd = document.getElementById("rDesde").value;
      const fh = document.getElementById("rHasta").value;
      const desdeTs = fd ? new Date(fd+"T00:00:00").getTime() : null;
      const hastaTs = fh ? new Date(fh+"T23:59:59.999").getTime() : null;
      if(desdeTs !== null && desdeTs < movementsLoadedSinceTs){
        await ensureMovementsLoadedFrom(desdeTs);
      }
      return movements.filter(m => (fe==="Todos"||m.employeeName===fe) && (fc==="Todas"||m.category===fc)
        && (desdeTs===null || m.ts >= desdeTs) && (hastaTs===null || m.ts <= hastaTs));
    }

    async function drawSummary(){
      const fd = document.getElementById("rDesde").value;
      const desdeTsCheck = fd ? new Date(fd+"T00:00:00").getTime() : null;

      if(desdeTsCheck !== null && desdeTsCheck < movementsLoadedSinceTs){

      }
      const summary = buildProductSummary(filteredRows);
      if(!summary.length){
        tbody.innerHTML = `<tr><td colspan="3"><div class="empty">Sin retiros para este filtro.</div></td></tr>`;

      const byCat = {};
      summary.forEach(s=>{

      Object.keys(byCat).sort().forEach(cat=>{
        rowsHtml += `<tr class="cat-heading"><td colspan="3">${esc(cat)}</td></tr>`;

      });

      document.getElementById("rDesde").value = "";
      document.getElementById("rHasta").value = "";

    };

        .sort((a,b)=> (a.category||"").localeCompare(b.category||"") || a.product.localeCompare(b.product));

      summary.forEach(s => aoa.push([s.category||"", s.product, s.count, s.total]));
      exportWorkbook([{name:"Resumen por producto", rows: aoa}], "resumen_retiros.xlsx");

  function renderAdminEstadisticas(content){
    content.innerHTML = `
      <div class="card">
        <h2>Estadísticas</h2>
        <p style="color:var(--ink-soft);font-size:12px;margin-top:-8px;">
          Resumen general de la actividad registrada. Usá los filtros para acotar por fecha.
        </p>
        <div class="filters" style="align-items:flex-end;margin-bottom:0;">
          <div style="flex:1;min-width:130px;">
            <label style="margin-bottom:4px;">Desde</label>
            <input type="date" id="eDesde" style="margin-bottom:0;">
          </div>
          <div style="flex:1;min-width:130px;">
            <label style="margin-bottom:4px;">Hasta</label>
            <input type="date" id="eHasta" style="margin-bottom:0;">
          </div>
          <button class="small-btn" id="eClearDatesBtn">Limpiar fechas</button>
        </div>
      </div>
      <div class="stat-grid" id="eStatGrid"></div>
      <div class="card">
        <h2>Productos más retirados</h2>
        <div id="eTopProducts"></div>
      </div>
      <div class="card">
        <h2>Retiros por empleado</h2>
        <div id="eTopEmployees"></div>
      </div>
      <div class="card">
        <h2>Retiros por categoría</h2>
        <div id="eTopCategories"></div>
      </div>
      <div class="card">
        <h2>Movimientos borrados por empleado</h2>
        <p style="color:var(--ink-soft);font-size:12px;margin-top:-8px;">
          Cantidad total de movimientos eliminados que pertenecían a cada empleado. No se ve afectado por el filtro de fechas de arriba.
        </p>
        <div id="eDeletedByEmployee"></div>
      </div>
    `;

    async function getFiltered(){
      const fd = document.getElementById("eDesde").value;
      const fh = document.getElementById("eHasta").value;
      const desdeTs = fd ? new Date(fd+"T00:00:00").getTime() : null;
      const hastaTs = fh ? new Date(fh+"T23:59:59.999").getTime() : null;
      if(desdeTs !== null && desdeTs < movementsLoadedSinceTs){
        await ensureMovementsLoadedFrom(desdeTs);
      }
      return movements.filter(m => (desdeTs===null || m.ts >= desdeTs) && (hastaTs===null || m.ts <= hastaTs));
    }

    function groupSum(rows, keyFn){
      const map = new Map();
      rows.forEach(m=>{
        const key = keyFn(m);
        if(!key) return;
        if(!map.has(key)) map.set(key, {key, total:0, count:0});
        const entry = map.get(key);
        entry.total += m.qty;
        entry.count += 1;
      });
      return Array.from(map.values());
    }

    function drawBars(containerId, entries, unit){
      unit = unit || "retiro";
      const container = document.getElementById(containerId);
      if(!entries.length){ container.innerHTML = `<div class="empty">Sin datos para este filtro.</div>`; return; }
      const max = Math.max(...entries.map(e=>e.total));
      container.innerHTML = entries.map(e => `
        <div class="bar-row">
          <div class="bar-label"><span>${esc(e.key)}</span><span><strong>${e.total}</strong> ${e.count===e.total?"":`(${e.count} ${unit}${e.count===1?"":"s"})`}</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${max ? (e.total/max*100) : 0}%;"></div></div>
        </div>
      `).join("");
    }

    async function draw(){
      const fd = document.getElementById("eDesde").value;
      const desdeTsCheck = fd ? new Date(fd+"T00:00:00").getTime() : null;
      if(desdeTsCheck !== null && desdeTsCheck < movementsLoadedSinceTs){
        document.getElementById("eStatGrid").innerHTML = `<div class="empty" style="width:100%;">Cargando movimientos de ese rango de fechas...</div>`;
      }
      let rows;
      try{
        rows = await getFiltered();
      }catch(err){
        document.getElementById("eStatGrid").innerHTML = `<div class="msg error" style="width:100%;">No se pudo cargar ese rango: ${esc(err.message||err)}</div>`;
        return;
      }
      const totalMov = rows.length;
      const totalUnidades = rows.reduce((s,m)=>s+m.qty,0);
      const empleadosActivos = new Set(rows.map(m=>m.employeeName)).size;
      const productosDistintos = new Set(rows.map(m=>m.product)).size;

      document.getElementById("eStatGrid").innerHTML = `
        <div class="stat-card"><div class="num">${totalMov}</div><div class="lbl">Movimientos registrados</div></div>
        <div class="stat-card"><div class="num">${totalUnidades}</div><div class="lbl">Unidades retiradas</div></div>
        <div class="stat-card"><div class="num">${empleadosActivos}</div><div class="lbl">Empleados con retiros</div></div>
        <div class="stat-card"><div class="num">${productosDistintos}</div><div class="lbl">Productos distintos</div></div>
      `;

      const byProduct = groupSum(rows, m=>m.product).sort((a,b)=>b.total-a.total).slice(0,8);
      drawBars("eTopProducts", byProduct);

      const byEmployee = groupSum(rows, m=>m.employeeName).sort((a,b)=>b.total-a.total);
      drawBars("eTopEmployees", byEmployee);

      const byCategory = groupSum(rows, m=>m.category||"Sin categoría").sort((a,b)=>b.total-a.total);
      drawBars("eTopCategories", byCategory);

      drawDeleted();
    }

    // Aparte de draw(): no depende de los filtros de fecha, y sus datos se
    // traen de Firestore recién la primera vez que se abre esta pestaña.
    function drawDeleted(){
      if(!deletedStatsLoaded){
        document.getElementById("eDeletedByEmployee").innerHTML = `<div class="empty">Cargando...</div>`;
        return;
      }
      const byDeleted = Object.values(deletedStats)
        .map(v=>({key: v.employeeName || "Desconocido", total: v.count || 0, count: v.count || 0}))
        .sort((a,b)=>b.total-a.total);
      drawBars("eDeletedByEmployee", byDeleted);
    }

    document.getElementById("eDesde").onchange = draw;
    document.getElementById("eHasta").onchange = draw;
    document.getElementById("eClearDatesBtn").onclick = () => {
      document.getElementById("eDesde").value = "";
      document.getElementById("eHasta").value = "";
      draw();
    };
    draw();
    if(!deletedStatsLoaded){
      ensureDeletedStatsLoaded().then(() => { if(view==="admin" && adminTab==="estadisticas") drawDeleted(); });
    }
  }

          <td><button class="small-btn small-btn-danger" data-id="${esc(a.id)}" data-action="delApertura">Borrar</button></td>
        </tr>
      `).join("") : `<tr><td colspan="4"><div class="empty">Sin aperturas para este filtro.</div></td></tr>`;
      Array.from(document.querySelectorAll("[data-action='delApertura']")).forEach(btn=>{
        btn.onclick = async () => {
          const a = aperturas.find(x=>x.id===btn.dataset.id);
          if(!confirm(`¿Está seguro que desea quitar el registro de apertura de "${a?esc(a.product):""}" (${a?fmtDate(a.ts):""})?`)) return;
          try{
            await deleteApertura(btn.dataset.id);
            showToast("Apertura eliminada", "ok");
          }catch(err){
            alert("No se pudo borrar: " + (err.message || err));
          }
          draw();
        };
      });
    }
    document.getElementById("haProd").onchange = draw;
    document.getElementById("haDesde").onchange = draw;
    document.getElementById("haHasta").onchange = draw;
    document.getElementById("haClear").onclick = () => {
      document.getElementById("haDesde").value = "";
      document.getElementById("haHasta").value = "";
      draw();
    };
    Array.from(document.querySelectorAll("[data-quick]")).forEach(btn=>{
      btn.onclick = () => {
        const now = new Date();
        let desde, hasta = now;
        if(btn.dataset.quick === "dia"){
          desde = now;
        }else if(btn.dataset.quick === "semana"){
          const diffToMonday = (now.getDay()+6)%7; // lunes=0
          desde = new Date(now.getFullYear(), now.getMonth(), now.getDate()-diffToMonday);
        }else{
          desde = new Date(now.getFullYear(), now.getMonth(), 1);
        }
        document.getElementById("haDesde").value = toDateInputValue(desde);
        document.getElementById("haHasta").value = toDateInputValue(hasta);
        draw();
      };
    });
    draw();
  }

  // --- Estadísticas: cada cuánto tiempo se abre cada producto, con
  // filtro de período (hoy / 7 días / 30 días / este mes / mes anterior /
  // personalizado) y una tabla comparativa ordenable. ---
  function renderDesayEstadisticas(content){
    content.innerHTML = `
      <div class="card">
        <h2>Estadísticas · Desayunador</h2>
        <p style="color:var(--ink-soft);font-size:12px;margin-top:-8px;">
          Objetivo: saber cada cuánto tiempo se abre cada producto.
        </p>
        <label>Período</label>
        <select id="dePeriod">
          <option value="hoy">Hoy</option>
          <option value="7d">Últimos 7 días</option>
          <option value="30d" selected>Últimos 30 días</option>
          <option value="mes">Este mes</option>
          <option value="mesant">Mes anterior</option>
          <option value="custom">Personalizado</option>
        </select>
        <div id="deCustomRange" style="display:none;margin-top:12px;">
          <div class="filters" style="align-items:flex-end;">
            <div style="flex:1;min-width:130px;"><label style="margin-bottom:4px;">Desde</label><input type="date" id="deDesde" style="margin-bottom:0;"></div>
            <div style="flex:1;min-width:130px;"><label style="margin-bottom:4px;">Hasta</label><input type="date" id="deHasta" style="margin-bottom:0;"></div>
          </div>
        </div>
      </div>
      <div id="deProductCards"></div>
      <div class="card">
        <h2>Comparación de productos</h2>
        <label>Ordenar por</label>
        <select id="deSortMode">
          <option value="masAperturas">Mayor cantidad de aperturas</option>
          <option value="menosAperturas">Menor cantidad de aperturas</option>
          <option value="masFrecuencia">Mayor frecuencia (se abre más seguido)</option>
          <option value="menosFrecuencia">Menor frecuencia (se abre menos seguido)</option>
        </select>
        <div style="overflow:auto;">
          <table>
            <thead><tr><th>Producto</th><th>Aperturas</th><th>Promedio</th></tr></thead>
            <tbody id="deCompareTbody"></tbody>
          </table>
        </div>
      </div>
    `;
    const periodSel = document.getElementById("dePeriod");
    const customBlock = document.getElementById("deCustomRange");
    periodSel.onchange = () => {
      customBlock.style.display = periodSel.value === "custom" ? "block" : "none";
      draw();
    };
    document.getElementById("deSortMode").onchange = drawCompare;
    document.getElementById("deDesde").onchange = draw;
    document.getElementById("deHasta").onchange = draw;

    let lastStats = [];

    function getRange(){
      const custom = periodSel.value === "custom";
      const cd = custom ? document.getElementById("deDesde").value : null;
      const ch = custom ? document.getElementById("deHasta").value : null;
      return resolveDesayPeriod(periodSel.value, cd, ch);
    }

    function draw(){
      const {desde, hasta} = getRange();
      lastStats = desayunoProductos.map(p => {
        const rows = aperturas.filter(a => a.product===p.name && (desde===null||a.ts>=desde) && (hasta===null||a.ts<=hasta));
        return { name: p.name, stats: computeAperturaStats(rows) };
      });
      document.getElementById("deProductCards").innerHTML = lastStats.map(({name, stats}) => {
        if(stats.count === 0){
          return `
            <div class="card">
              <h2>${esc(name.toUpperCase())}</h2>
              <div class="empty">Sin aperturas registradas en este período.</div>
            </div>
          `;
        }
        const suficiente = stats.count >= 2;
        return `
          <div class="card">
            <h2>${esc(name.toUpperCase())}</h2>
            <div class="stat-grid" style="margin-bottom:12px;">
              <div class="stat-card"><div class="num">${stats.count}</div><div class="lbl">Aperturas</div></div>
              <div class="stat-card"><div class="num" style="font-size:14px;">${esc(fmtDate(stats.first))}</div><div class="lbl">Primera apertura</div></div>
              <div class="stat-card"><div class="num" style="font-size:14px;">${esc(fmtDate(stats.last))}</div><div class="lbl">Última apertura</div></div>
            </div>
            <p style="font-size:13px;margin:6px 0;"><strong>Promedio entre aperturas:</strong> ${suficiente ? esc(fmtDuration(stats.avgMs)) : "Datos insuficientes"}</p>
            <p style="font-size:13px;margin:6px 0;"><strong>Mediana entre aperturas:</strong> ${suficiente ? esc(fmtDuration(stats.medianMs)) : "Datos insuficientes"}</p>
            ${suficiente ? `<p style="font-size:13px;margin:6px 0;color:var(--ink-soft);">Interpretación: "Se abre aproximadamente ${esc(fmtRoughFrequency(stats.avgMs))}."</p>` : ""}
            <div class="stat-grid" style="margin-top:10px;">
              <div class="stat-card"><div class="num">${suficiente ? stats.perDay.toFixed(2) : "—"}</div><div class="lbl">Aperturas / día</div></div>
              <div class="stat-card"><div class="num">${suficiente ? stats.perWeek.toFixed(1) : "—"}</div><div class="lbl">Aperturas / semana</div></div>
              <div class="stat-card"><div class="num">${suficiente ? stats.perMonth.toFixed(1) : "—"}</div><div class="lbl">Aperturas / mes</div></div>
            </div>
          </div>
        `;
      }).join("") || `<div class="card"><div class="empty">No hay productos configurados.</div></div>`;
      drawCompare();
    }

    function drawCompare(){
      const mode = document.getElementById("deSortMode").value;
      let rows = lastStats.slice();
      if(mode === "masAperturas") rows.sort((a,b)=>b.stats.count-a.stats.count);
      else if(mode === "menosAperturas") rows.sort((a,b)=>a.stats.count-b.stats.count);
      else if(mode === "masFrecuencia") rows.sort((a,b)=>(a.stats.avgMs ?? Infinity)-(b.stats.avgMs ?? Infinity));
      else if(mode === "menosFrecuencia") rows.sort((a,b)=>(b.stats.avgMs ?? -Infinity)-(a.stats.avgMs ?? -Infinity));
      document.getElementById("deCompareTbody").innerHTML = rows.length ? rows.map(({name,stats})=>`
        <tr>
          <td>${esc(name)}</td>
          <td>${stats.count}</td>
          <td>${stats.count>=2 ? esc(fmtFrequencyDecimal(stats.avgMs)) : "Datos insuficientes"}</td>
        </tr>
      `).join("") : `<tr><td colspan="3"><div class="empty">Sin datos.</div></td></tr>`;
    }

    draw();
  }

  // --- Lista configurable de productos del Desayunador (agregar/renombrar/
  // quitar), siempre con confirmación antes de quitar uno. ---
  function renderDesayProductos(content){
    content.innerHTML = `
      <div class="card">
        <h2>Productos de desayuno</h2>
        <p style="color:var(--ink-soft);font-size:12px;margin-top:-8px;">
          Esta es la lista que ve la empleada de Desayunador para registrar aperturas.
        </p>
        <div id="desayProdList"></div>
        <div class="add-cat-row">
          <input type="text" id="newDesayProdInput" placeholder="Nuevo producto (ej: Café)">
          <button class="small-btn" id="addDesayProdBtn">Agregar</button>
        </div>
      </div>
    `;
    function draw(){
      document.getElementById("desayProdList").innerHTML = desayunoProductos.length ? desayunoProductos.map(p=>`
        <div class="emp-row">
          <input type="text" value="${esc(p.name)}" data-id="${esc(p.id)}" class="desayProdName">
          <button class="small-btn" data-id="${esc(p.id)}" data-action="delDesayProd">Quitar</button>
        </div>
      `).join("") : `<div class="empty">No hay productos configurados.</div>`;
      Array.from(document.querySelectorAll(".desayProdName")).forEach(inp=>{
        inp.onchange = async () => {
          const val = inp.value.trim();
          if(!val) return;
          await updateDesayunoProducto(inp.dataset.id, val);
          const p = desayunoProductos.find(x=>x.id===inp.dataset.id);
          if(p) p.name = val;
        };
      });
      Array.from(document.querySelectorAll("[data-action='delDesayProd']")).forEach(btn=>{
        btn.onclick = async () => {
          const p = desayunoProductos.find(x=>x.id===btn.dataset.id);
          if(!confirm(`¿Está seguro que desea quitar el producto "${p ? esc(p.name) : ""}"?`)) return;
          await deleteDesayunoProducto(btn.dataset.id);
          draw();
        };
      });
    }
    draw();
    document.getElementById("addDesayProdBtn").onclick = async () => {
      const input = document.getElementById("newDesayProdInput");
      const val = input.value.trim();
      if(!val) return;
      if(desayunoProductos.some(p=>p.name.toLowerCase()===val.toLowerCase())){ alert("Ya existe ese producto."); return; }
      await addDesayunoProducto(val);
      input.value = "";
      draw();
    };
  }

  function render(){
    if(view==="login") renderLogin();
    else if(view==="form") renderForm();
    else if(view==="admin-login") renderAdminLogin();
    else if(view==="admin") renderAdmin();
    // Cada pantalla nueva arranca arriba del todo: si no, al venir de una
    // pantalla donde se había scrolleado hacia abajo (como al confirmar un
    // retiro), la siguiente pantalla podía verse descentrada, con el título
    // cortado arriba.
    window.scrollTo(0, 0);
  }

  // =======================================================================
  // BOTÓN/GESTO "ATRÁS" DEL CELULAR
  // =======================================================================
  // Se mantiene siempre una única entrada "guardia" en el historial del
  // navegador. Cada vez que el usuario toca atrás, esa entrada se consume
  // y dispara "popstate" acá abajo, en vez de sacarlo de la página:
  //  - Si estaba avanzado en el asistente de retiro (producto/cantidad/
  //    lista de movimientos), lo manda directo a elegir categoría.
  //  - Si ya estaba en la pantalla raíz (categoría, login, admin, etc.),
  //    la primera vez avisa "Tocá atrás de nuevo para salir"; si lo toca
  //    de nuevo enseguida, ahí sí se deja salir de verdad (no se vuelve a
  //    poner la entrada guardia).
  function pushHistoryGuard(){
    history.pushState({ appGuard: true }, "", location.href);
  }
  window.addEventListener("popstate", function(){
    if(view === "form" && (formStep === "producto" || formStep === "cantidad" || formStep === "lista")){
      formStep = "categoria";
      backExitArmed = false;
      clearTimeout(backExitTimer);
      pushHistoryGuard();
      render();
    } else if(backExitArmed){
      // Segunda vez seguida en la pantalla raíz: se deja salir,
      // no se vuelve a interceptar el historial.
    } else {
      backExitArmed = true;
      showToast("Tocá atrás de nuevo para salir", "info");
      pushHistoryGuard();
      clearTimeout(backExitTimer);
      backExitTimer = setTimeout(() => { backExitArmed = false; }, 2000);
    }
  });
  pushHistoryGuard();

  // =======================================================================
  // INICIO
  // =======================================================================
  if(NOT_CONFIGURED){
    renderSetupNeeded();
  }else{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    firebase.auth().signInAnonymously()
      .then(loadAll)
      .catch(err => {
        app.innerHTML = `
          <div class="topbar"><h1>Control de Stock</h1><p class="sub">Error de conexión</p></div>
          <section><div class="card"><div class="msg error">
            No se pudo iniciar sesión con Firebase: ${esc(err.message || err)}.
            Verificá que el proveedor "Anonymous" esté activado en
            Authentication &gt; Sign-in method.
          </div></div></section>
        `;
      });
  }
})();
</script>
</body>
